[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "literature-helper"
version = "0.7.0"
description = "A human-friendly and agent-ready CLI for personal literature requests."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Literature Helper contributors" }]
keywords = ["cli", "literature", "playwright", "research", "tui"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "playwright>=1.49,<2",
  "pypdf>=5,<7",
  "questionary>=2.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
lithelper = "literature_helper.cli:main"
literature-helper = "literature_helper.cli:main"
keyantong = "literature_helper.cli:main"

[project.urls]
Homepage = "https://github.com/Shawp1n/literature-helper"
Repository = "https://github.com/Shawp1n/literature-helper"
Issues = "https://github.com/Shawp1n/literature-helper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/literature_helper", "src/keyantong_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
